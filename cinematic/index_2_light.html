<!-- Local-preview guard: these decks compile JSX in the browser via <script type="text/babel">,
     which browsers refuse to run from a file:// URL. Without this the page is simply blank.
     Served over http(s) — including GitHub Pages — nothing below runs. -->
<script>
if (location.protocol === "file:") {
  document.addEventListener("DOMContentLoaded", function () {
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'font-family:-apple-system,BlinkMacSystemFont,\'SF Pro Display\',sans-serif;background:#f4f2ec;color:#191713;padding:32px;">' +
      '<div style="max-width:560px;">' +
      '<div style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#5f5a4e;">Local preview</div>' +
      '<h1 style="font-size:28px;line-height:1.2;margin:14px 0 0;font-weight:500;">This deck needs to be served over HTTP</h1>' +
      '<p style="font-size:16px;line-height:1.55;color:#5f5a4e;margin:16px 0 0;">' +
      'It compiles JSX in the browser, and browsers block that from a <code>file://</code> URL. ' +
      'Opening the file directly from Finder will always show a blank slide. ' +
      'The published site is unaffected.</p>' +
      '<p style="font-size:16px;line-height:1.55;color:#5f5a4e;margin:14px 0 0;">From the project folder, run:</p>' +
      '<pre style="margin:12px 0 0;padding:14px 16px;background:#fffdf9;border:1px solid rgba(25,23,19,.12);' +
      'border-radius:10px;font-size:14px;overflow-x:auto;">python3 .claude/serve.py "$(pwd)" 8001</pre>' +
      '<p style="font-size:16px;line-height:1.55;color:#5f5a4e;margin:14px 0 0;">' +
      'then open <b>http://127.0.0.1:8001</b>.</p>' +
      '</div></div>';
  });
}
</script>

  <script type="text/babel" src="selfie-app.jsx"></script>
  <script>
    // Lightbox gallery — click any .zoomable to view the full original frame,
    // then navigate the set with ← / → (or the on-screen arrows).
    (function () {
      let box = null;
      let items = [];   // [{ full, cap }]
      let idx = 0;

      function close() {
        if (!box) return;
        const el = box;
        box = null;
        el.classList.remove('open');
        setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 300);
      }

      function render() {
        if (!box) return;
        const it = items[idx];
        const img = box.querySelector('.lb-img');
        img.classList.remove('swap');
        void img.offsetWidth;
        img.classList.add('swap');
        img.src = it.full;
        box.querySelector('.lb-cap').innerHTML =
          (it.cap || 'Original frame') +
          '<span class="sub">Full uncropped detector output</span>';
        box.querySelector('.lb-count').textContent =
          String(idx + 1).padStart(2, '0') + ' / ' + String(items.length).padStart(2, '0');
        const single = items.length < 2;
        box.querySelector('.lb-prev').style.display = single ? 'none' : '';
        box.querySelector('.lb-next').style.display = single ? 'none' : '';
      }

      function go(delta) {
        if (!box || !items.length) return;
        idx = (idx + delta + items.length) % items.length;
        render();
      }

      function open(list, start) {
        close();
        items = list;
        idx = start;
        box = document.createElement('div');
        box.className = 'lightbox';
        box.innerHTML =
          '<button class="lb-close" aria-label="Close">\u00d7</button>' +
          '<button class="lb-nav lb-prev" aria-label="Previous">\u2039</button>' +
          '<div class="lb-stage"><img class="lb-img" alt="Full detection frame" /></div>' +
          '<button class="lb-nav lb-next" aria-label="Next">\u203a</button>' +
          '<div class="lb-foot"><div class="lb-cap"></div><div class="lb-count"></div></div>';
        document.body.appendChild(box);
        void box.offsetWidth;
        box.classList.add('open');
        render();

        box.addEventListener('click', function (e) {
          if (e.target.closest('.lb-nav') || e.target.classList.contains('lb-img')) return;
          close();
        });
        box.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); go(-1); });
        box.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); go(1); });
        box.querySelector('.lb-close').addEventListener('click', function (e) { e.stopPropagation(); close(); });
      }

      // Delegate clicks (images are rendered by React)
      document.addEventListener('click', function (e) {
        const z = e.target.closest && e.target.closest('.zoomable');
        if (!z) return;
        e.preventDefault();
        e.stopPropagation();
        // Build the gallery from every zoomable in the same scene, in DOM order
        const scope = z.closest('.scene') || document;
        const all = Array.prototype.slice.call(scope.querySelectorAll('.zoomable'));
        const list = all.map(function (el) {
          return { full: el.getAttribute('data-full'), cap: el.getAttribute('data-cap') };
        });
        open(list, all.indexOf(z));
      });

      // Keyboard: Esc closes, ←/→ navigate. Swallow keys so the deck doesn't
      // navigate underneath the open lightbox.
      document.addEventListener('keydown', function (e) {
        if (!box) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowRight') go(1);
        else if (e.key === 'ArrowLeft') go(-1);
        e.stopPropagation();
        e.preventDefault();
      }, true);
    })();
  </script>
</body>
