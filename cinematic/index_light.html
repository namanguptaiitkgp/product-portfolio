[
  "Open cold. The lesson begins as a film — a single propositional sentence about a 1998 carwash, sized like a movie title. We set tone, runtime, and the promise: an eight-minute story about why one of the most counter-intuitive product moves in history actually worked.",
  "Two loyalty cards, presented as physical objects on a flat lay. Same final reward; different starting line. The numbers underneath (19% vs 34%) are the entire surprise of the lesson — we let them land before we explain anything.",
  "We move inside two customers' heads as a comic dialogue. Two panels. Same situation, two thought bubbles. The framing is the whole lesson — Group A is at a starting line; Group B is mid-race.",
  "Now we name the thing. The Endowed Progress Effect. Definition on the left in editorial italic, three sub-principles on the right: goal-gradient, endowed status, loss aversion. This is the academic core, kept short and elegant.",
  "Translation to software. Same five-task onboarding, with and without two pre-filled, gift-framed steps. 41% versus 68%. Identical work — the only thing that changed is where the user thinks they begin.",
  "The principle in the wild. We zoom into a phone showing a profile-completeness ring at 84% — the LinkedIn move. On the left, four real-world examples (Duolingo, Stripe, Notion) so the user starts pattern-matching against products they use every day.",
  "Strategic breakdown. We annotate a fake-but-realistic flow with six numbered design moves — every one of them copyable. This is the working-designer chapter: stop and rewatch.",
  "The mental model, as a formula. Outcome equals actual effort times perceived progress. The lever is the second variable, and the lever is almost free. This is the slide students will screenshot.",
  "Retention curve. We show the day-30 decay for both cohorts as two bar columns. The endowed cohort is 2.7× more retained at day 30 — the gift on day one is still paying interest a month later.",
  "Final reflection. Three takeaways. A call to action to continue to Lesson 02. The end card lands quiet, like the credits of a short film — leaving room for the idea to settle."
]
