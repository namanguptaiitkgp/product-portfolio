<!-- Local-preview guard: these decks compile JSX in the browser via <script type="text/babel">,
     which browsers refuse to run from a file:// URL. Without this the page is simply blank.
     Served over http(s) — including GitHub Pages — nothing below runs. -->
<script>
if (location.protocol === "file:") {
  document.addEventListener("DOMContentLoaded", function () {
    document.body.innerHTML =

      'font-family:-apple-system,BlinkMacSystemFont,\'SF Pro Display\',sans-serif;background:#f4f2ec;color:#191713;padding:32px;">' +
      '<div style="max-width:560px;">' +
      '<div style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#5f5a4e;">Local preview</div>' +
      '<h1 style="font-size:28px;line-height:1.2;margin:14px 0 0;font-weight:500;">This deck needs to be served over HTTP</h1>' +
      '<p style="font-size:16px;line-height:1.55;color:#5f5a4e;margin:16px 0 0;">' +
      'It compiles JSX in the browser, and browsers block that from a <code>file://</code> URL. ' +
      'Opening the file directly from Finder will always show a blank slide. ' +
      'The published site is unaffected.</p>' +
      '<p style="font-size:16px;line-height:1.55;color:#5f5a4e;margin:14px 0 0;">From the project folder, run:</p>' +
      '<pre style="margin:12px 0 0;padding:14px 16px;background:#fffdf9;border:1px solid rgba(25,23,19,.12);' +

      '<p style="font-size:16px;line-height:1.55;color:#5f5a4e;margin:14px 0 0;">' +
      'then open <b>http://127.0.0.1:8001</b>.</p>' +
      '</div></div>';
  });
}
</script>

  <script>
    /* Robustness net: if the document timeline never advances (print/PDF,
       throttled/offscreen tabs), force the reveal elements visible so content
       never stays stuck at opacity:0. Live browsers animate normally. */
    (function () {
      function forceVisible() {
        var s = document.createElement('style');
        s.id = '__reveal_fallback';
        s.textContent =
          '.a-rise,.a-fade,.a-slide,.a-pop{opacity:1!important;transform:none!important;filter:none!important}' +
          '.scene-track{transition:none!important}';
        document.head.appendChild(s);
      }
      setTimeout(function () {
        var t = document.timeline && document.timeline.currentTime;
        if (!t) forceVisible();
      }, 500);
    })();
  </script>
