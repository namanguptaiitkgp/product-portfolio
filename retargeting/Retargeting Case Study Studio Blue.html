  <script>
    /* Robustness net: the cinematic entrance animations rely on a running
       document timeline. In contexts where the timeline never advances
       (print / PDF export, deeply throttled or offscreen tabs), the reveal
       elements would otherwise stay stuck at their pre-animation opacity:0.
       Live browsers animate normally; only the frozen case forces content
       visible. Reduced-motion is handled in CSS. */
    (function () {
      function forceVisible() {
        var s = document.createElement('style');
        s.id = '__reveal_fallback';
        s.textContent =
          '.a-rise,.a-fade,.a-slide,.a-pop{opacity:1!important;transform:none!important;filter:none!important}' +
          '.funnel-step .bar{transform:none!important}' +
          '.scene-track{transition:none!important}';
        document.head.appendChild(s);
      }
      setTimeout(function () {
        var t = document.timeline && document.timeline.currentTime;
        if (!t) forceVisible();   // timeline frozen → guarantee content shows
      }, 500);
    })();
  </script>
